name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install system dependencies
        # Refresh the index first: the runner image's baked apt index goes stale
        # and portaudio19-dev then 404s.
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      # Complexity ceiling, not a style rule: --max-absolute C fails only on
      # genuine runaway (CC 21+), leaving judgment calls to review. The average
      # gate is what protects past decomposition work from wholesale decay.
      # tests/ is excluded — linear setup-then-assert scores badly for reasons
      # that don't signal a maintenance problem.
      - name: Complexity
        run: uv run xenon --max-absolute C --max-average A meeko

      - name: Test
        run: uv run pytest --cov-report=xml
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Fork PRs have no CODECOV_TOKEN, so the upload can only fail there.
      # (fail_ci_if_error already defaults to false, so it never failed the job —
      # this skips the guaranteed-to-error step entirely.)
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
