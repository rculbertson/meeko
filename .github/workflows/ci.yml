name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install system dependencies
        # Refresh the index first: the runner image's baked apt index goes stale
        # and portaudio19-dev then 404s.
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      # Thresholds and rationale live in the script, shared with the pre-push
      # hook. Runs before the test suite so a complexity failure comes back in
      # a second rather than after full coverage.
      - name: Complexity
        run: ./scripts/check_complexity.sh

      - name: Test
        run: uv run pytest --cov-report=xml

      # Fork PRs have no CODECOV_TOKEN, so the upload can only fail there.
      # (fail_ci_if_error already defaults to false, so it never failed the job —
      # this skips the guaranteed-to-error step entirely.)
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
