[project]
name = "meeko"
version = "0.1.0"
description = "A self-hosted voice assistant built on Deepgram and Claude"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Ryan Culbertson" }
]
keywords = [
    "anthropic",
    "claude",
    "deepgram",
    "openwakeword",
    "raspberry-pi",
    "self-hosted",
    "voice-assistant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "anthropic>=1.8.0",
    "deepgram-sdk>=7.10.0",
    "httpx>=0.27",
    "onnxruntime>=1.17.0",
    "openwakeword>=0.6.0",
    "pyaudio>=0.2.14",
    "pyusb>=1.3.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[project.urls]
Homepage = "https://github.com/rculbertson/meeko"
Documentation = "https://github.com/rculbertson/meeko#readme"
Repository = "https://github.com/rculbertson/meeko.git"
Issues = "https://github.com/rculbertson/meeko/issues"

[project.scripts]
meeko = "meeko.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "radon>=6.0.1",
    "rapidfuzz>=3.0",
    "ruff>=0.16.8",
    "xenon>=0.9.3",
]

[[tool.uv.dependency-metadata]]
# openwakeword 0.6.0 lists tflite-runtime as a hard linux dep, but
# tflite-runtime has no cp314 wheels. We only use the ONNX backend, so
# rewrite openwakeword's metadata to drop tflite-runtime. The remaining
# list mirrors openwakeword's other runtime deps (ONNX path).
name = "openwakeword"
version = "0.6.0"
requires-dist = [
    "onnxruntime>=1.10.0,<2",
    "scipy>=1.3,<2",
    "numpy>=1.20,<3",
    "requests>=2.0,<3",
    "tqdm>=4.0,<5",
    "scikit-learn>=1.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: tests that call external APIs (Deepgram, etc.)",
]
filterwarnings = [
    "ignore::DeprecationWarning:deepgram",
    "ignore::DeprecationWarning:websockets",
]
addopts = "--cov=meeko --cov-report=term-missing -m 'not integration'"

[tool.coverage.run]
source = ["meeko"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pyright]
# Basic mode over the app package; tests lean on fakes and duck typing.
include = ["meeko"]
typeCheckingMode = "basic"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "ASYNC",
    "BLE",
    "RUF",
    "C4",
    "PIE",
    "RSE",
    "PGH",
    "T10",
    "ISC",
    "LOG",
    "YTT",
    "ICN",
]

[tool.ruff.lint.per-file-ignores]
# Test helpers poll with a timeout parameter and sleep loops by design.
"tests/**" = ["ASYNC109", "ASYNC110"]
