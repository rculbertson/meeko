[project]
name = "meeko"
version = "0.1.0"
description = "A self-hosted voice assistant built on Deepgram and Claude"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.40.0",
    "deepgram-sdk>=6.1.1",
    "httpx>=0.27",
    "onnxruntime>=1.17.0",
    "openwakeword>=0.6.0",
    "pyaudio>=0.2.14",
    "pyusb>=1.3.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "radon>=6.0.1",
    "rapidfuzz>=3.0",
    "ruff>=0.15.10",
]

[[tool.uv.dependency-metadata]]
# openwakeword 0.6.0 lists tflite-runtime as a hard linux dep, but
# tflite-runtime has no cp314 wheels. We only use the ONNX backend, so
# rewrite openwakeword's metadata to drop tflite-runtime. The remaining
# list mirrors openwakeword's other runtime deps (ONNX path).
name = "openwakeword"
version = "0.6.0"
requires-dist = [
    "onnxruntime>=1.10.0,<2",
    "scipy>=1.3,<2",
    "numpy>=1.20,<3",
    "requests>=2.0,<3",
    "tqdm>=4.0,<5",
    "scikit-learn>=1.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: tests that call external APIs (Deepgram, etc.)",
]
filterwarnings = [
    "ignore::DeprecationWarning:deepgram",
    "ignore::DeprecationWarning:websockets",
]
addopts = "--cov=meeko --cov-report=term-missing -m 'not integration'"

[tool.coverage.run]
source = ["meeko"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
